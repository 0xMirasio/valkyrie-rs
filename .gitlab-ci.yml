stages:
  - test

default:
  image: rust:1.78
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key: cargo-${CI_COMMIT_REF_SLUG}
    paths:
      - target/
      - .cargo/registry/
      - .cargo/git/

fmt:
  stage: test
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

clippy:
  stage: test
  script:
    - rustup component add clippy
    - cargo clippy --all-targets --all-features -- -D warnings

tests:
  stage: test
  script:
    - cargo test --all --locked
