name: Rust CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone qiling rootfs into ./rootfs
        run: |
          rm -rf rootfs
          git clone --depth 1 https://github.com/qilingframework/rootfs rootfs
          ls -la rootfs
          test -d rootfs/x8664_linux

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --all --locked
